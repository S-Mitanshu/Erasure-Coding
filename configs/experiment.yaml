experiment:
  name: "erasure_coding_vs_replication_scaleout"
  seed: 42

workload:
  sizes_bytes:
    - 102400       # 100 KB
    - 512000       # 500 KB
    - 1048576      # 1 MB
    - 5242880      # 5 MB
    - 10485760     # 10 MB
    - 20971520     # 20 MB

schemes:
  - name: "rs_4_2"
    type: "reed_solomon"
    data_shards: 4
    parity_shards: 2
    node_count: 6

  - name: "rs_8_2"
    type: "reed_solomon"
    data_shards: 8
    parity_shards: 2
    node_count: 10

  - name: "rs_8_4"
    type: "reed_solomon"
    data_shards: 8
    parity_shards: 4
    node_count: 12

  - name: "xor_4_2"
    type: "xor"
    data_shards: 4
    parity_shards: 2
    node_count: 6

  - name: "replication_3x"
    type: "replication"
    replication_factor: 3
    node_count: 6

failure_scenarios:
  - count: 0
    description: "Healthy cluster (baseline reads)"
  - count: 1
    description: "Single node failure (most common operational case)"
  - count: 2
    description: "Concurrent dual node failure"

metrics:
  record_encoding_time: true
  record_recovery_time: true
  record_bytes_transferred: true
  record_cpu_percent: true
  record_memory_peak_mb: true
