[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erasure-storage-experiment"
version = "0.1.0"
description = "Small erasure-coded distributed storage prototype for fault-tolerance experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "reedsolo>=1.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
